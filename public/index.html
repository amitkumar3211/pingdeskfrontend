    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

        {
          "@type": "Question",
          "name": "How do I install Pingdesk on Slack?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Click 'Add to Slack' on our website. You'll authorize Pingdesk in your Slack workspace, and it's ready to use in under 60 seconds. No configuration needed."

          "@type": "Question",
          "name": "Is Pingdesk free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! Pingdesk has a free plan for up to 3 users and 50 requests per month. Paid plans start at $12/month for growing teams."

        },
        {
          "@type": "Question",
          "name": "How does Pingdesk track requests in Slack?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Use the /request slash command in any Slack channel to create a trackable request. Pingdesk automatically assigns it, tracks status, and sends follow-up reminders if it goes unanswered."
          }
        },
        {
          "@type": "Question",
          "name": "What happens if someone doesn't respond to a request?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pingdesk automatically sends polite follow-up reminders to the assigned person. You can customize reminder intervals. No more manually chasing people."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data secure?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Pingdesk uses encrypted connections, doesn't store message content beyond what's needed for request tracking, and follows Slack's security best practices."
          }
        }
